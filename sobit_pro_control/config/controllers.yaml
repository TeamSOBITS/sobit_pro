# Gazebo (gz_ros2_control) only: P-gain for position-commanded joints.
# The default of 0.1 makes steer/head/arm joints track their targets with a
# ~10 s time constant, so the base never finishes steer alignment and
# teleop looks dead. 5.0 was too aggressive: the four grounded steer joints
# whip around and the wheel/floor friction makes the base jump. 1.0 gives a
# ~1 s time constant — fast enough for teleop, gentle on contacts. The real
# robot does not run this node, so this section has no effect on hardware.
/**/gz_ros_control:
  ros__parameters:
    position_proportional_gain: 1.0

# 実機用。Dynamixel バスの通信頻度そのものなので上げていない。
# **Gazebo は controllers_gz.yaml（50 Hz）を読む** — 走行の切り替えの
# 遅さがこの 10 Hz だったため分離した。理由はあちらのコメント。
/**/controller_manager:
  ros__parameters:
    update_rate: 10  # Hz

    head_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    hand_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    steer_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


/**/head_trajectory_controller:
  ros__parameters:
    joints:
      - head_pan_joint
      - head_tilt_joint

    allow_partial_joints_goal: true
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

/**/arm_trajectory_controller:
  ros__parameters:
    joints:
      - arm_shoulder_1_tilt_joint
      - arm_shoulder_2_tilt_joint
      - arm_elbow_upper_1_tilt_joint
      - arm_elbow_upper_2_tilt_joint
      - arm_elbow_lower_tilt_joint
      - arm_elbow_lower_pan_joint
      - arm_wrist_tilt_joint

    allow_partial_joints_goal: true
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

/**/hand_trajectory_controller:
  ros__parameters:
    joints:
      - hand_joint

    allow_partial_joints_goal: true
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity


/**/steer_joint_trajectory_controller:
  ros__parameters:
    joints:
      - wheel_f_l_steer_joint
      - wheel_f_r_steer_joint
      - wheel_b_l_steer_joint
      - wheel_b_r_steer_joint

    allow_partial_joints_goal: true
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

/**/velocity_controller:
  ros__parameters:
    joints:
      - wheel_f_l_drive_joint
      - wheel_f_r_drive_joint
      - wheel_b_l_drive_joint
      - wheel_b_r_drive_joint