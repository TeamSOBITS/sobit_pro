/**/controller_manager:
  ros__parameters:
    update_rate: 100  #Hz
    use_sim_time: True
    
    velocity_controller:
      type: "velocity_controllers/JointGroupVelocityController"

    joint_trajectrory_controller:
      type: "joint_trajectory_controller/JointTrajectoryController"
    
    steer_trajectory_controller:
      type: "position_controllers/JointTrajectoryController"

    wheel_trajectory_controller:
      type: "velocity_controllers/JointGroupVelocityController"

    diff_controller:
      type: "diff_drive_controller/DiffDriveController"

    joint_state_broadcaster:
      type: "joint_state_broadcaster/JointStateBroadcaster"

/**/velocity_controller:
  ros__parameters:
    joints:
      - arm_shoulder_1_tilt_joint
      - arm_shoulder_2_tilt_joint
      - arm_elbow_upper_1_tilt_joint
      - arm_elbow_upper_2_tilt_joint
      - arm_elbow_lower_tilt_joint
      - arm_elbow_lower_pan_joint
      - arm_wrist_tilt_joint
      - hand_joint
      - head_pan_joint
      - head_tilt_joint

/**/joint_trajectrory_controller:
  ros__parameters:
    joints:
      - arm_shoulder_1_tilt_joint
      - arm_shoulder_2_tilt_joint
      - arm_elbow_upper_1_tilt_joint
      - arm_elbow_upper_2_tilt_joint
      - arm_elbow_lower_tilt_joint
      - arm_elbow_lower_pan_joint
      - arm_wrist_tilt_joint
      - hand_joint
      - head_pan_joint
      - head_tilt_joint

    command_interfaces:
      - position
    
    state_interfaces:
      - position
      - velocity

/**/steer_trajectory_controller:
  ros__parameters:
    joints: &robot_steer_joints
      - wheel_f_l_steer_joint
      - wheel_f_r_steer_joint
      - wheel_b_l_steer_joint
      - wheel_b_r_steer_joint
    constraints:
      stopped_velocity_tolerance: 0.5
      goal_time: 0.05
    allow_partial_joints_goal: true

/**/wheel_trajectory_controller:
  ros__parameters:
    
    joints: &robot_wheel_joints
      - wheel_f_l_drive_joint
      - wheel_f_r_drive_joint
      - wheel_b_l_drive_joint
      - wheel_b_r_drive_joint
    gains: # Required because we're controlling a velocity interface
      wheel_f_l_drive_joint: {p: 100,  d: 1, i: 1, i_clamp: 1} # Smaller 'p' term, since ff term does most of the work
      wheel_f_r_drive_joint: {p: 100,  d: 1, i: 1, i_clamp: 1} # Smaller 'p' term, since ff term does most of the work
      wheel_b_l_drive_joint: {p: 100,  d: 1, i: 1, i_clamp: 1} # Smaller 'p' term, since ff term does most of the work
      wheel_b_r_drive_joint: {p: 100,  d: 1, i: 1, i_clamp: 1} # Smaller 'p' term, since ff term does most of the work

    velocity_ff:
      wheel_f_l_drive_joint: 1000.0
      wheel_f_r_drive_joint: 1000.0
      wheel_b_l_drive_joint: 1000.0
      wheel_b_r_drive_joint: 1000.0

#https://control.ros.org/humble/doc/ros2_controllers/diff_drive_controller/doc/userdoc.html
/**/diff_controller:
  ros__parameters:
    left_wheel_names : ["while_f_l_drive_joint", "while_b_l_drive_joint"]

    right_wheel_names: ["wheel_f_r_drive_joint", "wheel_b_r_drive_joint"]

    wheel separation: 0.200
    #wheels_per_side: 2 # actully 2, but both are controlled by 1 signal
    wheel_radius: 0.045

    wheel_separation_multiplier   : 1.0
    left_wheel_radius_multipller  : 1.0
    right_wheel_radius_multipller : 1.0

    publish_raye : 50.0
    odom_flame_id: odom
    base_flame_id: base_footprint
    pose_covariance_diagonal : [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]

    open_loop: true
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    publish_limited_velocity: true
    use_stamped_vel: true
    #velocity_rolling_window_size: 10

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity:  1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity:  1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration:  1.0
    angular.z.min_acceleration: -1.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0    




